[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
license = "MIT"
name = "orcview"
version = "0.2.1"
description = "Inspect project-scoped agent traces using your existing AI model."
requires-python = ">=3.11"
dependencies = ["mcp==2.3.0"]
[project.scripts]
orcview-mcp = "orcview.mcp_server:main"
[tool.hatch.build.targets.wheel]
packages = ["orcview"]
